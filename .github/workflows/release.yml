name: Release

# 打 tag 即发布：把扩展打成 zip，创建 GitHub Release 并把 zip 作为 asset 上传。
#
# 发布方式：
#   1. 改 cep-extension/CSXS/manifest.xml 里的 ExtensionBundle@Version
#   2. git tag -a v0.2.0 -m "v0.2.0" && git push --follow-tags
#
# 注意 tag 名（去掉 v）与 manifest 的 Version 不一致时会直接失败 ——
# 避免出现「下载的包自称 0.1.0、Release 却写着 v0.2.0」这种对不上的情况。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0），必须已经存在'
        required: true

permissions:
  contents: write      # 创建 Release 需要

jobs:
  release:
    name: 打包并发布
    # Windows runner：make-zxp.js 调用的 Adobe ZXPSignCmd 只有 win/mac
    # 二进制，签名在 Windows 上原生完成；打包本身跨平台（内置 zip 写入器）。
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.2'

      - name: FFmpeg 测试工具
        run: choco install ffmpeg --no-progress -y

      - name: 后端测试依赖
        run: python -I -m pip install numpy==2.2.3 opencv-python-headless==4.11.0.86

      - name: 全部检查、行为测试、隔离安装与双包校验
        run: node tools/test-all.js

      - name: 校验 tag 与 manifest 版本一致
        run: node tools/release-info.js --check-tag "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"

      - name: 打包
        run: node tools/package.js

      - name: 签名 zxp
        # 临时自签名证书，用完即删 —— 私钥与密码不进仓库、不进 secrets。
        # 自签名的代价：用户安装时会看到「发布者不受信任」提示；
        # zip 仍是主推分发方式，zxp 只是给 ZXP 安装器用户的可选形态。
        run: node tools/make-zxp.js

      - name: 生成 Release 说明
        run: node tools/release-info.js --write-notes release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.zip
            dist/*.zxp
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
