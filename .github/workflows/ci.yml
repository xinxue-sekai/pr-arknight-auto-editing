name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 全测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.2'
      - name: FFmpeg 测试工具 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg 测试工具 (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: 后端测试依赖
        run: python -I -m pip install numpy==2.2.3 opencv-python-headless==4.11.0.86
      - name: 静态检查、全部行为测试、后端测试与双包校验
        # test-all discovers tools/test-*.js, including preview and isolated setup.
        # Windows downloads the locked runtime and tests real install/rollback in temp.
        run: node tools/test-all.js
